/* ─── FIREBASE ─── */
const LS_KEY_ISSUES = "bkmv_issues_v2"; // old local data (one-time import)
const COL_TABS="bkmv_tabs", COL_ISSUES="bkmv_issues";
let auth=null, db=null, fbError="";
try{
  if(typeof firebase==="undefined"||typeof firebaseConfig==="undefined") throw new Error("Firebase config not loaded (check firebase-config.js)");
  firebase.initializeApp(firebaseConfig);
  auth=firebase.auth(); db=firebase.firestore();
  db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
}catch(e){ fbError=e.message; }
const clean=o=>JSON.parse(JSON.stringify(o)); // Firestore rejects undefined
function getLocalIssues(){
  try{ const d=localStorage.getItem(LS_KEY_ISSUES); return d?JSON.parse(d):[]; }catch(e){return [];}
}

function LoginScreen(){
  const [email,setEmail]=useState(""),[pass,setPass]=useState(""),[err,setErr]=useState(""),[busy,setBusy]=useState(false);
  const go=()=>{
    if(!email.trim()||!pass){setErr("Enter email and password");return;}
    setErr("");setBusy(true);
    auth.signInWithEmailAndPassword(email.trim(),pass)
      .catch(x=>{setErr(/invalid|wrong|user-not-found|credential/.test(x.code)?"Incorrect email or password":x.message);setBusy(false);});
  };
  const inp={width:"100%",background:"#0d2d6e",border:"1px solid #1d4ed855",borderRadius:9,padding:"11px 13px",color:"#fff",fontSize:14,marginBottom:10};
  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{width:"100%",maxWidth:340,background:"#0a1f4e",border:"1px solid #1d4ed855",borderRadius:16,padding:"28px 24px",textAlign:"center"}}>

        <input type="email" placeholder="Email" value={email} onChange={e=>setEmail(e.target.value)} autoComplete="username" style={inp}/>
        <input type="password" placeholder="Password" value={pass} onChange={e=>setPass(e.target.value)} autoComplete="current-password"
          onKeyDown={e=>e.key==="Enter"&&go()} style={inp}/>
        <button onClick={go} disabled={busy} style={{width:"100%",background:"#1d4ed8",color:"#fff",border:"none",borderRadius:9,padding:"11px",fontSize:14,fontWeight:700,cursor:"pointer",opacity:busy?.6:1}}>
          🔐 Login

        {err&&<div style={{color:"#f87171",fontSize:12,marginTop:10}}>{err}</div>}
      </div>
    </div>
  );
}

/* Auth gate + live Firestore data */
function Root(){
  const [user,setUser]=useState(undefined); // undefined = checking
  const [tabs,setTabs]=useState([]);
  const [issues,setIssues]=useState([]);
  const [tabsReady,setTabsReady]=useState(false);
  const [dataErr,setDataErr]=useState("");
  const [online,setOnline]=useState(navigator.onLine);
  const [localCount,setLocalCount]=useState(()=>getLocalIssues().length);

  useEffect(()=>{
    const on=()=>setOnline(true),off=()=>setOnline(false);
    window.addEventListener("online",on);window.addEventListener("offline",off);
    return()=>{window.removeEventListener("online",on);window.removeEventListener("offline",off);};
  },[]);
  useEffect(()=>{ if(!auth){setUser(null);return;} return auth.onAuthStateChanged(u=>setUser(u||null)); },[]);

  useEffect(()=>{
    if(!user||!db){setTabs([]);setIssues([]);setTabsReady(false);return;}
    const onErr=e=>setDataErr(e.code==="permission-denied"?"Permission denied: update Firestore rules to allow "+COL_TABS+" and "+COL_ISSUES:e.message);
    const u1=db.collection(COL_TABS).onSnapshot(snap=>{
      if(snap.empty&&!snap.metadata.fromCache){ // first run: seed starting tablets
        const b=db.batch();
        INIT_TABS.forEach(t=>b.set(db.collection(COL_TABS).doc(t.id),clean(t)));
        b.commit().catch(onErr);
      }else{
        const arr=snap.docs.map(d=>d.data());
        arr.sort((x,y)=>x.id.localeCompare(y.id,undefined,{numeric:true}));
        setTabs(arr);setTabsReady(true);
      }
    },onErr);
    const u2=db.collection(COL_ISSUES).onSnapshot(snap=>{
      const arr=snap.docs.map(d=>d.data());
      arr.sort((x,y)=>(x.id||"").localeCompare(y.id||"",undefined,{numeric:true}));
      setIssues(arr);
    },onErr);
    return()=>{u1();u2();};
  },[user]);

  const saveIssue=rec=>db.collection(COL_ISSUES).doc(rec.id).set(clean(rec));
  const deleteIssue=id=>db.collection(COL_ISSUES).doc(id).delete();
  const importLocal=async()=>{
    const list=getLocalIssues();
    if(!list.length)return;
    const b=db.batch();
    list.forEach(r=>b.set(db.collection(COL_ISSUES).doc(String(r.id)),clean({...r,id:String(r.id)})));
    await b.commit();
    localStorage.removeItem(LS_KEY_ISSUES);setLocalCount(0);
  };

  if(fbError) return <div style={{padding:30,color:"#f87171"}}>⚠ {fbError}</div>;
  if(user===undefined) return <div style={{padding:40,textAlign:"center",color:"#64748b"}}>Loading…</div>;
  if(!user) return <LoginScreen/>;
  if(!tabsReady) return <div style={{padding:40,textAlign:"center",color:dataErr?"#f87171":"#64748b"}}>{dataErr||"Loading data…"}</div>;
  return <App user={user} tabs={tabs} issues={issues} online={online} dataErr={dataErr}
    onSaveIssue={saveIssue} onDeleteIssue={deleteIssue} onLogout={()=>auth.signOut()}
    localCount={localCount} onImportLocal={importLocal}/>;
}

/* ─── QR (real QR-like pattern using serial data) ─── */
function QRCanvas({value,size=120}){
  const ref=useRef();
  useEffect(()=>{
    const c=ref.current; if(!c)return;
    const ctx=c.getContext("2d");
    const dpr=window.devicePixelRatio||1;
    c.width=size*dpr; c.height=size*dpr;
    c.style.width=size+"px"; c.style.height=size+"px";
    ctx.scale(dpr,dpr);
    const cells=25, cs=size/cells;
    // White bg
    ctx.fillStyle="#fff"; ctx.fillRect(0,0,size,size);
    ctx.fillStyle="#0a2472";
    // Deterministic data from string
    const bytes=[...value].map(c=>c.charCodeAt(0));
    function bit(i){
      const bi=i%bytes.length;
      return (bytes[bi]>>(i%8))&1;
    }
    // Draw finder patterns (3 corners)
    function finder(ox,oy){
      for(let i=0;i<7;i++) for(let j=0;j<7;j++){
        const outer=i===0||i===6||j===0||j===6;
        const inner=i>=2&&i<=4&&j>=2&&j<=4;
        if(outer||inner){ctx.fillRect((ox+j)*cs,(oy+i)*cs,cs-.5,cs-.5);}
      }
    }
    finder(0,0); finder(cells-7,0); finder(0,cells-7);
    // Timing strips
    for(let i=8;i<cells-8;i++){
      if(i%2===0){
        ctx.fillRect(i*cs,6*cs,cs-.5,cs-.5);
        ctx.fillRect(6*cs,i*cs,cs-.5,cs-.5);
      }
    }
    // Data modules
    let bi=0;
    for(let i=0;i<cells;i++) for(let j=0;j<cells;j++){
      const inFinder=(i<8&&j<8)||(i<8&&j>=cells-8)||(i>=cells-8&&j<8);
      const inTiming=(i===6||j===6);
      if(!inFinder&&!inTiming){
        if(bit(bi++)) ctx.fillRect(j*cs,i*cs,cs-.5,cs-.5);
      }
    }
  },[value,size]);
  return <canvas ref={ref} style={{display:"block",borderRadius:2}}/>;
}

/* ─── STATUS BADGE ─── */
function Badge({condition,issue,small}){
  const ok=condition==="WORKING";
  const charging=condition==="NOT CHARGING";
  const hi=issue&&issue.trim();
  let col,lbl;
  if(charging){col="#f59e0b";lbl="Not Charging";}
  else if(!ok){col="#ef4444";lbl="Not Working";}
  else if(hi){col="#f59e0b";lbl="Has Issues";}
  else{col="#22c55e";lbl="Working";}
  return(
    <span style={{display:"inline-flex",alignItems:"center",gap:4,background:col+"22",color:col,
      border:`1px solid ${col}55`,borderRadius:20,padding:small?"1px 7px":"2px 10px",
      fontSize:small?9:11,fontWeight:700,letterSpacing:.5,whiteSpace:"nowrap"}}>
      <span style={{width:5,height:5,borderRadius:"50%",background:col,display:"inline-block",flexShrink:0}}/>
      {lbl}
    </span>
  );
}

/* ─── ISSUE STATUS BADGE ─── */
function IssueStatusBadge({status}){
  const cfg={
    "ISSUED":{col:"#f59e0b",lbl:"Issued"},
    "RETURNED":{col:"#22c55e",lbl:"Returned"},
    "OVERDUE":{col:"#ef4444",lbl:"Overdue"},
  };
  const {col,lbl}=cfg[status]||{col:"#64748b",lbl:status};
  return(
    <span style={{display:"inline-flex",alignItems:"center",gap:4,background:col+"22",color:col,
      border:`1px solid ${col}55`,borderRadius:20,padding:"1px 8px",fontSize:10,fontWeight:700,letterSpacing:.5}}>
      <span style={{width:5,height:5,borderRadius:"50%",background:col,display:"inline-block"}}/>
      {lbl}
    </span>
  );
}

/* ─── TOAST ─── */
function Toast({msg,onClose}){
  useEffect(()=>{const t=setTimeout(onClose,2800);return()=>clearTimeout(t);},[]);
  return(
    <div style={{position:"fixed",bottom:24,right:24,zIndex:9999,background:"#1d4ed8",
      color:"#fff",borderRadius:10,padding:"12px 20px",fontSize:13,fontWeight:600,
      boxShadow:"0 8px 32px rgba(0,0,0,.5)",border:"1px solid #3b82f655",
      animation:"slideUp .3s ease"}}>
      ✓ {msg}
    </div>
  );
}

              <input type="date" value={form.handoverDate} onChange={e=>set("handoverDate",e.target.value)}
                style={{width:"100%",background:"#0d2d6e",border:"1px solid #1d4ed855",borderRadius:9,
                  padding:"9px 12px",color:"#fff",fontSize:13,colorScheme:"dark"}}/>
            </div>
          </div>

          <div>
            <div style={{color:"#94a3b8",fontSize:10,fontWeight:700,letterSpacing:1.5,marginBottom:5}}>REASON FOR ISSUE</div>
            <textarea value={form.reason} onChange={e=>set("reason",e.target.value)} rows={2}
              placeholder="eg: Used for Grade 10 ICT practical class"
              style={{width:"100%",background:"#0d2d6e",border:"1px solid #1d4ed855",borderRadius:9,
                padding:"9px 12px",color:"#fff",fontSize:13,resize:"vertical"}}/>
          </div>

          <div>
            <div style={{color:"#94a3b8",fontSize:10,fontWeight:700,letterSpacing:1.5,marginBottom:5}}>STATUS</div>
            <select value={form.status} onChange={e=>set("status",e.target.value)}
              style={{width:"100%",background:"#0d2d6e",border:"1px solid #1d4ed855",borderRadius:9,
                padding:"9px 12px",color:"#fff",fontSize:13}}>
              <option value="ISSUED">Issued (Not Yet Returned)</option>
              <option value="RETURNED">Returned</option>
              <option value="OVERDUE">Overdue</option>
            </select>
          </div>

          <div>
            <div style={{color:"#94a3b8",fontSize:10,fontWeight:700,letterSpacing:1.5,marginBottom:5}}>NOTES (OPTIONAL)</div>
            <textarea value={form.notes} onChange={e=>set("notes",e.target.value)} rows={2}
              placeholder="Any additional notes..."
              style={{width:"100%",background:"#0d2d6e",border:"1px solid #1d4ed855",borderRadius:9,
                padding:"9px 12px",color:"#fff",fontSize:13,resize:"vertical"}}/>
          </div>
        </div>

        <div style={{display:"flex",gap:10,marginTop:20}}>
          <button onClick={onClose} style={{flex:1,background:"#0d2d6e",border:"1px solid #1d4ed855",
            color:"#94a3b8",borderRadius:9,padding:"10px",cursor:"pointer",fontSize:13,fontWeight:600}}>
            Cancel
          </button>
          <button onClick={()=>valid&&onSave({...form,id:existingIssue?.id||Date.now().toString()})}
            disabled={!valid}
            style={{flex:2,background:valid?"#1d4ed8":"#0d2d6e",border:"none",
              color:valid?"#fff":"#475569",borderRadius:9,padding:"10px",cursor:valid?"pointer":"not-allowed",
              fontSize:13,fontWeight:700,transition:"all .2s"}}>
            {existingIssue?"Update Record":"Save Issue Record"}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ─── CARD ─── */
function Card({tab,issues,onClick}){
  const ok=tab.condition==="WORKING";
  const hi=tab.issue&&tab.issue.trim();
  const notOk=!ok||tab.condition==="NOT CHARGING";
  const bc=notOk?"#ef444433":hi?"#f59e0b33":"#22c55e22";
  const isST=tab.id.startsWith("ST");
  const [hov,setHov]=useState(false);
  const tabIssues=issues.filter(i=>i.tabId===tab.id);
  const activeIssue=tabIssues.find(i=>i.status==="ISSUED");

  return(
    <div onClick={()=>onClick(tab)}
      onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
      style={{background:"linear-gradient(135deg,#0d2d6e,#0a1f4e)",
        border:`1px solid ${hov?"#3b82f6aa":bc}`,
        borderRadius:14,padding:13,cursor:"pointer",transition:"all .2s",
        display:"flex",flexDirection:"column",gap:8,position:"relative",overflow:"hidden",
        transform:hov?"translateY(-3px)":"none",
        boxShadow:hov?"0 8px 30px rgba(10,36,114,.5)":"none"}}>
      <div style={{position:"absolute",top:0,right:0,background:isST?"#1d4ed8":"#7c3aed",
        color:"#fff",fontSize:7,fontWeight:800,padding:"2px 8px",borderBottomLeftRadius:7,letterSpacing:1}}>
        {isST?"STUDENT":"TEACHER"}
      </div>
      {activeIssue&&(
        <div style={{position:"absolute",top:0,left:0,background:"#f59e0b",
          color:"#000",fontSize:7,fontWeight:800,padding:"2px 8px",borderBottomRightRadius:7,letterSpacing:1}}>
          ISSUED
        </div>
      )}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginTop:activeIssue?8:0}}>
        <div>
          <div style={{color:"#93c5fd",fontSize:9,fontWeight:600,letterSpacing:2,marginBottom:1}}>TAB ID</div>
          <div style={{color:"#fff",fontSize:19,fontWeight:800,letterSpacing:1}}>{tab.id}</div>
        </div>
        <QRCanvas value={`BKMV|${tab.id}|${tab.tabSerial}`} size={52}/>
      </div>
      <div style={{borderTop:"1px solid #ffffff15",paddingTop:6}}>
        <div style={{color:"#64748b",fontSize:8,fontWeight:600,letterSpacing:1,marginBottom:1}}>TAB SERIAL</div>
        <div style={{color:"#cbd5e1",fontSize:11,fontFamily:"monospace"}}>{tab.tabSerial}</div>
      </div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:3}}>
        <Badge condition={tab.condition} issue={tab.issue} small/>
        {tabIssues.length>0&&(
          <span style={{color:"#93c5fd",fontSize:9,fontWeight:600}}>
            📋 {tabIssues.length} record{tabIssues.length>1?"s":""}
          </span>
        )}
      </div>
    </div>
  );
}

/* ─── PDF PRINT VIEW ─── */

  const getTab=id=>tabs.find(t=>t.id===id)||{};

  useEffect(()=>{
    const style=document.createElement("style");
    style.id="print-override";
    style.innerHTML=`@media print{body{background:#fff!important;color:#000!important}.no-print{display:none!important}}`;
    document.head.appendChild(style);
    return()=>document.getElementById("print-override")?.remove();
  },[]);

  return(
    <div style={{position:"fixed",inset:0,background:"#fff",zIndex:5000,overflowY:"auto"}}>
      {/* Print controls */}
      <div className="no-print" style={{background:"#0a2472",padding:"12px 20px",display:"flex",
        gap:12,alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",
        position:"sticky",top:0,zIndex:1}}>
        <div style={{color:"#fff",fontWeight:700,fontSize:14}}>
          📄 Print Preview — {printIssues.length} Records
        </div>
        <div style={{display:"flex",gap:8}}>
          <button onClick={()=>window.print()} style={{background:"#22c55e",border:"none",color:"#fff",
            borderRadius:8,padding:"8px 20px",cursor:"pointer",fontSize:13,fontWeight:700}}>
            🖨️ Print / Save PDF
          </button>
          <button onClick={onClose} style={{background:"#ef4444",border:"none",color:"#fff",
            borderRadius:8,padding:"8px 16px",cursor:"pointer",fontSize:13,fontWeight:700}}>
            ✕ Close
          </button>
        </div>
      </div>

      {/* A4 page */}
      <div style={{maxWidth:794,margin:"24px auto",background:"#fff",color:"#000",fontFamily:"Arial,sans-serif",
        padding:"40px 50px",boxShadow:"0 4px 40px rgba(0,0,0,.2)"}}>
        {/* Report header */}
        <div style={{borderBottom:"3px solid #0a2472",paddingBottom:16,marginBottom:20,display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div>
            <div style={{fontSize:18,fontWeight:900,color:"#0a2472",letterSpacing:.5}}>
              BIDENZIL KOBBEKADUWA MAHA VIDYALAYA
            </div>
            <div style={{fontSize:13,color:"#1d4ed8",fontWeight:700,marginTop:2}}>HALIELA</div>
            <div style={{fontSize:11,color:"#64748b",marginTop:4}}>TAB ISSUANCE REPORT</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:10,color:"#64748b"}}>Generated</div>
            <div style={{fontSize:11,fontWeight:700,color:"#0a2472"}}>{new Date().toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})}</div>
            <div style={{fontSize:10,color:"#64748b",marginTop:4}}>Total Records: {printIssues.length}</div>
            <div style={{fontSize:10,color:"#64748b"}}>Status Filter: {filter==="ALL"?"All":filter}</div>
          </div>
        </div>

        {/* Summary row */}
        <div style={{display:"flex",gap:12,marginBottom:20,flexWrap:"wrap"}}>
          {[
            ["Total Issued",issues.filter(i=>i.status==="ISSUED").length,"#f59e0b"],
            ["Returned",issues.filter(i=>i.status==="RETURNED").length,"#22c55e"],
            ["Overdue",issues.filter(i=>i.status==="OVERDUE").length,"#ef4444"],
            ["Total Records",issues.length,"#0a2472"],

            <div key={l} style={{flex:1,minWidth:100,background:c+"15",border:`2px solid ${c}`,

              const statusColors={"ISSUED":"#f59e0b","RETURNED":"#22c55e","OVERDUE":"#ef4444"};
              const sc=statusColors[rec.status]||"#64748b";
              return(
                <tr key={rec.id} style={{background:idx%2===0?"#f8fafc":"#fff",borderBottom:"1px solid #e2e8f0"}}>

          <div style={{marginTop:30,borderTop:"2px solid #0a2472",paddingTop:20}}>
            <div style={{fontSize:12,fontWeight:700,color:"#0a2472",marginBottom:16,letterSpacing:.5}}>
              QR CODE REFERENCE
            </div>
            <div style={{display:"flex",flexWrap:"wrap",gap:12}}>
              {printIssues.slice(0,20).map(rec=>{
                const tab=getTab(rec.tabId);
                return(
                  <div key={rec.id} style={{border:"1px solid #e2e8f0",borderRadius:8,padding:8,
                    textAlign:"center",minWidth:100}}>
                    <QRCanvas value={`BKMV-HALIELA|${rec.tabId}|${tab.tabSerial||""}|${rec.teacherName}|${rec.issuedDate}`} size={80}/>
                    <div style={{fontSize:8,fontWeight:700,color:"#0a2472",marginTop:4}}>{rec.tabId}</div>
                    <div style={{fontSize:7,color:"#64748b",marginTop:1}}>{rec.teacherName.split(" ")[0]}</div>
                  </div>
                );
              })}
            </div>
            {printIssues.length>20&&(
              <div style={{fontSize:9,color:"#94a3b8",marginTop:8}}>
                * Showing QR codes for first 20 records only.
              </div>
            )}
          </div>
        )}

        <div style={{marginTop:30,borderTop:"1px solid #e2e8f0",paddingTop:12,
          display:"flex",justifyContent:"space-between",fontSize:9,color:"#94a3b8"}}>
          <span>BKMV HALIELA · TAB MANAGEMENT SYSTEM</span>
          <span>Generated on {new Date().toLocaleString()}</span>
        </div>
      </div>
    </div>
  );
}

            </div>
          ))}
        </div>
        <div style={{marginTop:20,borderTop:"1px solid #e2e8f0",paddingTop:10,fontSize:9,
          color:"#94a3b8",display:"flex",justifyContent:"space-between"}}>
          <span>BKMV HALIELA · TAB MANAGEMENT SYSTEM · Total: {tabs.length} devices</span>
          <span>{new Date().toLocaleString()}</span>
        </div>
      </div>
    </div>
  );
}

/* ─── ISSUE RECORDS PAGE ─── */
function IssueRecordsPage({issues, tabs, onEdit, onDelete, onAdd}){
  const [search,setSearch]=useState("");
  const [statusFilter,setStatusFilter]=useState("ALL");
  const [printFilter,setPrintFilter]=useState(null);

  const filtered=issues.filter(i=>{
    const s=search.toLowerCase();
    const ms=!s||i.teacherName.toLowerCase().includes(s)||i.nic.toLowerCase().includes(s)||i.tabId.toLowerCase().includes(s);
    const mf=statusFilter==="ALL"||i.status===statusFilter;
    return ms&&mf;
  }).sort((a,b)=>new Date(b.issuedDate)-new Date(a.issuedDate));

  const getTab=id=>tabs.find(t=>t.id===id)||{};

  if(printFilter!==null) return <PrintIssuePDF issues={issues} tabs={tabs} filter={printFilter} onClose={()=>setPrintFilter(null)}/>;

  return(
    <div style={{padding:"20px"}}>
      {/* Stats */}
      <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:18}}>
        {[
          ["All Records",issues.length,"#3b82f6"],
          ["Currently Issued",issues.filter(i=>i.status==="ISSUED").length,"#f59e0b"],
          ["Returned",issues.filter(i=>i.status==="RETURNED").length,"#22c55e"],
          ["Overdue",issues.filter(i=>i.status==="OVERDUE").length,"#ef4444"],
        ].map(([l,v,c])=>(
          <div key={l} style={{background:c+"15",border:`1px solid ${c}40`,borderRadius:9,
            padding:"8px 16px",minWidth:90,textAlign:"center",flex:1}}>
            <div style={{color:c,fontSize:20,fontWeight:800}}>{v}</div>
            <div style={{color:"#94a3b8",fontSize:9,letterSpacing:.5,fontWeight:600}}>{l.toUpperCase()}</div>
          </div>
        ))}
      </div>

      {/* Controls */}
      <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:16,alignItems:"center"}}>
        <div style={{position:"relative",flex:1,minWidth:160}}>
          <span style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",color:"#64748b",fontSize:13}}>🔍</span>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search by teacher, NIC, tab ID..."
            style={{width:"100%",background:"#0d2d6e",border:"1px solid #1d4ed855",borderRadius:9,
              padding:"9px 11px 9px 32px",color:"#fff",fontSize:13}}/>
        </div>
        <div style={{display:"flex",gap:3,background:"#0a1f4e",borderRadius:9,padding:3,border:"1px solid #1d4ed830"}}>
          {[["ALL","All"],["ISSUED","Issued"],["RETURNED","Returned"],["OVERDUE","Overdue"]].map(([v,l])=>(
            <button key={v} onClick={()=>setStatusFilter(v)} style={{background:statusFilter===v?"#1d4ed8":"transparent",
              color:statusFilter===v?"#fff":"#64748b",border:"none",borderRadius:6,padding:"5px 10px",
              cursor:"pointer",fontSize:11,fontWeight:600}}>
              {l}
            </button>
          ))}
        </div>
        <div style={{display:"flex",gap:6}}>
          <button onClick={()=>setPrintFilter(statusFilter)} style={{background:"#0a2472",border:"1px solid #1d4ed855",
            color:"#93c5fd",borderRadius:9,padding:"8px 14px",cursor:"pointer",fontSize:12,fontWeight:600,display:"flex",alignItems:"center",gap:6}}>
            📄 Print Report
          </button>
          <button onClick={()=>setPrintFilter("ALL")} style={{background:"#0a2472",border:"1px solid #1d4ed855",
            color:"#93c5fd",borderRadius:9,padding:"8px 14px",cursor:"pointer",fontSize:12,fontWeight:600,display:"flex",alignItems:"center",gap:6}}>
            📊 Full Report
          </button>
        </div>
      </div>

      <div style={{color:"#64748b",fontSize:11,marginBottom:12,letterSpacing:.5}}>
        Showing {filtered.length} of {issues.length} records
      </div>

      {/* Records table */}
      {filtered.length===0?(
        <div style={{textAlign:"center",padding:"50px",color:"#475569"}}>
          <div style={{fontSize:32,marginBottom:10}}>📋</div>
          <div style={{fontSize:14,fontWeight:600}}>No issue records found</div>
          <div style={{fontSize:12,marginTop:5}}>Records appear here when a tab is issued to a teacher</div>
        </div>
      ):(
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {filtered.map(rec=>{
            const tab=getTab(rec.tabId);
            return(
              <div key={rec.id} style={{background:"#0d2d6e44",border:"1px solid #1d4ed820",borderRadius:11,
                padding:"12px 14px",display:"grid",gap:8}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:8}}>
                  <div style={{display:"flex",gap:12,alignItems:"center",flexWrap:"wrap"}}>
                    <div>
                      <div style={{color:"#93c5fd",fontSize:10,fontWeight:700,letterSpacing:1}}>TAB</div>
                      <div style={{color:"#fff",fontSize:15,fontWeight:800}}>{rec.tabId}</div>
                    </div>
                    <div>
                      <div style={{color:"#64748b",fontSize:10,fontWeight:700,letterSpacing:1}}>TEACHER</div>
                      <div style={{color:"#e2e8f0",fontSize:13,fontWeight:600}}>{rec.teacherName}</div>
                    </div>
                    <div>
                      <div style={{color:"#64748b",fontSize:10,fontWeight:700,letterSpacing:1}}>NIC</div>
                      <div style={{color:"#cbd5e1",fontSize:12,fontFamily:"monospace"}}>{rec.nic}</div>
                    </div>
                  </div>
                  <div style={{display:"flex",gap:6,alignItems:"center"}}>
                    <IssueStatusBadge status={rec.status}/>
                    <button onClick={()=>onEdit(rec)} style={{background:"#1d4ed820",border:"1px solid #1d4ed840",
                      color:"#93c5fd",borderRadius:7,padding:"4px 10px",cursor:"pointer",fontSize:11,fontWeight:600}}>Edit</button>
                    <button onClick={()=>onDelete(rec.id)} style={{background:"#ef444415",border:"1px solid #ef444430",
                      color:"#f87171",borderRadius:7,padding:"4px 10px",cursor:"pointer",fontSize:11,fontWeight:600}}>Delete</button>
                  </div>
                </div>
                <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                  <div style={{background:"#ffffff08",borderRadius:7,padding:"5px 10px",fontSize:11,flex:1,minWidth:120}}>
                    <div style={{color:"#64748b",fontSize:9,fontWeight:700,letterSpacing:1,marginBottom:1}}>ISSUED DATE</div>
                    <div style={{color:"#cbd5e1"}}>{rec.issuedDate||"—"}</div>
                  </div>
                  <div style={{background:"#ffffff08",borderRadius:7,padding:"5px 10px",fontSize:11,flex:1,minWidth:120}}>
                    <div style={{color:"#64748b",fontSize:9,fontWeight:700,letterSpacing:1,marginBottom:1}}>HANDOVER DATE</div>
                    <div style={{color:"#cbd5e1"}}>{rec.handoverDate||"Not returned"}</div>
                  </div>
                  {rec.reason&&(
                    <div style={{background:"#ffffff08",borderRadius:7,padding:"5px 10px",fontSize:11,flex:2,minWidth:160}}>
                      <div style={{color:"#64748b",fontSize:9,fontWeight:700,letterSpacing:1,marginBottom:1}}>REASON</div>
                      <div style={{color:"#cbd5e1"}}>{rec.reason}</div>
                    </div>
                  )}
                </div>
                {rec.notes&&(
                  <div style={{background:"#fbbf2408",borderRadius:7,padding:"5px 10px",fontSize:10,color:"#fde68a"}}>
                    📝 {rec.notes}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ─── MAIN APP ─── */
function App({user,tabs,issues,online,dataErr,onSaveIssue,onDeleteIssue,onLogout,localCount,onImportLocal}){
  const [search,setSearch]=useState("");
  const [filter,setFilter]=useState("ALL");
  const [typeFilter,setTypeFilter]=useState("ALL");
  const [selectedTab,setSelectedTab]=useState(null);
  const [view,setView]=useState("grid");
  const [page,setPage]=useState("tabs"); // tabs | records
  const [issueFormFor,setIssueFormFor]=useState(null); // {tab, existingIssue}
  const [toast,setToast]=useState(null);
  const [showQRPrint,setShowQRPrint]=useState(false);


  const showToast=msg=>{setToast(msg);};

  const handleSaveIssue=useCallback((rec)=>{
    const wasEdit=!!issueFormFor?.existingIssue;
    onSaveIssue(rec).catch(e=>showToast("Save failed: "+e.message));
    setIssueFormFor(null);
    showToast(wasEdit?"Issue record updated":"Issue record saved");
  },[issueFormFor,onSaveIssue]);

  const handleDeleteIssue=useCallback((id)=>{
    if(!window.confirm("Delete this issue record?"))return;
    onDeleteIssue(id).catch(e=>showToast("Delete failed: "+e.message));
    showToast("Record deleted");
  },[onDeleteIssue]);

  const total=tabs.length;
  const working=tabs.filter(t=>t.condition==="WORKING"&&!t.issue?.trim()).length;
  const issueCount=tabs.filter(t=>t.condition==="WORKING"&&t.issue?.trim()).length;
  const broken=tabs.filter(t=>t.condition!=="WORKING").length;
  const activeIssues=issues.filter(i=>i.status==="ISSUED").length;

  const filtered=tabs.filter(t=>{
    const s=search.toLowerCase();
    const ms=!s||t.id.toLowerCase().includes(s)||t.tabSerial.toLowerCase().includes(s)||t.kbSerial.toLowerCase().includes(s);
    const ok=t.condition==="WORKING"; const hi=t.issue?.trim();
    const mf=filter==="ALL"||(filter==="WORKING"&&ok&&!hi)||(filter==="ISSUES"&&ok&&hi)||(filter==="NOT_WORKING"&&!ok);
    const mt=typeFilter==="ALL"||(typeFilter==="ST"&&t.id.startsWith("ST"))||(typeFilter==="TH"&&t.id.startsWith("TH"));
    return ms&&mf&&mt;
  });

  if(showQRPrint) return <PrintQRPage tabs={tabs} onClose={()=>setShowQRPrint(false)}/>;

  return(
    <div style={{minHeight:"100vh",background:"linear-gradient(180deg,#050f2e 0%,#071540 40%,#060d28 100%)"}}>
      {/* HEADER */}
      <div className="no-print" style={{background:"linear-gradient(135deg,#0a2472,#0d3099)",
        borderBottom:"2px solid #1d4ed855",padding:"14px 20px",position:"sticky",top:0,zIndex:100,
        boxShadow:"0 4px 20px rgba(0,0,0,.5)"}}>
        <div style={{maxWidth:1200,margin:"0 auto"}}>
          <div style={{display:"flex",alignItems:"center",gap:14,flexWrap:"wrap",marginBottom:8}}>
            <Logo size={50}/>
            <div style={{flex:1}}>
              <div style={{fontSize:8,letterSpacing:3,color:"#93c5fd",fontWeight:600}}>BIDENZIL KOBBEKADUWA MAHA VIDYALAYA · HALIELA</div>
              <div style={{fontSize:17,fontWeight:800,letterSpacing:.5}}>TAB Management System</div>
              <div style={{fontSize:9,color:"#64748b",letterSpacing:1}}>LET'S ENTER THE WORLD WITH KNOWLEDGE</div>
            </div>
            <div className="stat-grid" style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              {[
                [total,"Total","#3b82f6"],
                [working,"Working","#22c55e"],
                [issueCount,"Issues","#f59e0b"],
                [broken,"Faults","#ef4444"],
                [activeIssues,"Issued Out","#a855f7"],
              ].map(([v,l,c])=>(
                <div key={l} className="stat-box" style={{background:c+"15",border:`1px solid ${c}40`,
                  borderRadius:9,padding:"4px 11px",textAlign:"center",minWidth:60}}>
                  <div style={{color:c,fontSize:17,fontWeight:800}}>{v}</div>
                  <div style={{color:"#94a3b8",fontSize:7,letterSpacing:.5,fontWeight:600}}>{l.toUpperCase()}</div>
                </div>
              ))}
            </div>
          </div>
          {/* Page tabs */}
          <div style={{display:"flex",gap:0,borderBottom:"1px solid #ffffff15"}}>
            <button className={`tab-btn${page==="tabs"?" active":""}`} onClick={()=>setPage("tabs")}>
              📱 Tablets ({total})
            </button>
            <button className={`tab-btn${page==="records"?" active":""}`} onClick={()=>setPage("records")}>
              📋 Issue Records ({issues.length})
            </button>
            <div style={{marginLeft:"auto",display:"flex",gap:6,alignItems:"center",paddingBottom:4,flexWrap:"wrap"}}>
              <span style={{fontSize:10,fontWeight:700,color:online?"#4ade80":"#fb923c"}}>{online?"🟢 Live":"🟠 Offline"}</span>
              <span className="issue-col-hide" style={{fontSize:10,color:"#64748b"}}>{user.email}</span>
              {localCount>0&&<button onClick={()=>onImportLocal().then(()=>showToast("Local records uploaded")).catch(e=>showToast("Upload failed: "+e.message))}
                style={{background:"#7c3aed",border:"none",color:"#fff",borderRadius:7,padding:"5px 12px",cursor:"pointer",fontSize:11,fontWeight:600}}>
                ☁️ Upload {localCount} local records
              </button>}
              <button onClick={()=>setShowQRPrint(true)} style={{background:"#0a2472",border:"1px solid #1d4ed855",
                color:"#93c5fd",borderRadius:7,padding:"5px 12px",cursor:"pointer",fontSize:11,fontWeight:600}}>
                🔲 Print All QR
              </button>
              <button onClick={onLogout} style={{background:"transparent",border:"1px solid #ffffff25",
                color:"#94a3b8",borderRadius:7,padding:"5px 12px",cursor:"pointer",fontSize:11,fontWeight:600}}>
                Logout
              </button>
            </div>
          </div>
        </div>
      </div>

      {/* PAGE CONTENT */}
      <div style={{maxWidth:1200,margin:"0 auto"}}>
        {page==="tabs"&&(
          <div style={{padding:"18px 20px"}}>
            {/* Filters */}
            <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:14,alignItems:"center"}}>
              <div style={{position:"relative",flex:1,minWidth:180}}>
                <span style={{position:"absolute",left:11,top:"50%",transform:"translateY(-50%)",color:"#64748b",fontSize:13}}>🔍</span>
                <input value={search} onChange={e=>setSearch(e.target.value)}
                  placeholder="Search ID or serial..."
                  style={{width:"100%",background:"#0d2d6e",border:"1px solid #1d4ed855",borderRadius:9,
                    padding:"9px 11px 9px 33px",color:"#fff",fontSize:13}}/>
              </div>
              <div style={{display:"flex",gap:3,background:"#0a1f4e",borderRadius:9,padding:3,border:"1px solid #1d4ed830"}}>
                {[["ALL","All"],["WORKING","✓ OK"],["ISSUES","⚠ Issues"],["NOT_WORKING","✗ Fault"]].map(([v,l])=>(
                  <button key={v} onClick={()=>setFilter(v)} style={{background:filter===v?"#1d4ed8":"transparent",
                    color:filter===v?"#fff":"#64748b",border:"none",borderRadius:6,padding:"5px 10px",
                    cursor:"pointer",fontSize:11,fontWeight:600}}>
                    {l}
                  </button>
                ))}
              </div>
              <div style={{display:"flex",gap:3,background:"#0a1f4e",borderRadius:9,padding:3,border:"1px solid #1d4ed830"}}>
                {[["ALL","All"],["ST","Students"],["TH","Teachers"]].map(([v,l])=>(
                  <button key={v} onClick={()=>setTypeFilter(v)} style={{background:typeFilter===v?"#7c3aed":"transparent",
                    color:typeFilter===v?"#fff":"#64748b",border:"none",borderRadius:6,padding:"5px 10px",
                    cursor:"pointer",fontSize:11,fontWeight:600}}>
                    {l}
                  </button>
                ))}
              </div>
              <div style={{display:"flex",gap:3,background:"#0a1f4e",borderRadius:9,padding:3,border:"1px solid #1d4ed830"}}>
                {[["grid","⊞"],["list","☰"]].map(([v,ic])=>(
                  <button key={v} onClick={()=>setView(v)} style={{background:view===v?"#1d4ed8":"transparent",
                    color:view===v?"#fff":"#64748b",border:"none",borderRadius:6,padding:"5px 9px",
                    cursor:"pointer",fontSize:15}}>
                    {ic}
                  </button>
                ))}
              </div>
            </div>

            <div style={{color:"#64748b",fontSize:11,marginBottom:12,letterSpacing:.5}}>
              Showing {filtered.length} of {tabs.length} tablets · Click any card for details &amp; issue records
            </div>

            {view==="grid"&&(
              <div className="tab-cards" style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:11}}>
                {filtered.map(t=><Card key={t.id} tab={t} issues={issues} onClick={setSelectedTab}/>)}
              </div>
            )}

            {view==="list"&&(
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                <div style={{display:"grid",gridTemplateColumns:"70px 54px 1fr 1fr 110px 80px 60px",
                  gap:10,padding:"7px 14px",color:"#64748b",fontSize:9,fontWeight:700,letterSpacing:1.5,
                  borderBottom:"1px solid #ffffff10"}}>
                  <span>ID</span><span>QR</span><span>TAB SERIAL</span>
                  <span className="issue-col-hide">KB SERIAL</span><span>STATUS</span>
                  <span className="issue-col-hide">RECORDS</span><span>ISSUED</span>
                </div>
                {filtered.map(t=>{
                  const tIssues=issues.filter(i=>i.tabId===t.id);
                  const active=tIssues.find(i=>i.status==="ISSUED");
                  return(
                    <div key={t.id} onClick={()=>setSelectedTab(t)}
                      style={{display:"grid",gridTemplateColumns:"70px 54px 1fr 1fr 110px 80px 60px",
                        gap:10,padding:"9px 14px",background:"#0d2d6e44",border:"1px solid #1d4ed820",
                        borderRadius:9,cursor:"pointer",alignItems:"center",transition:"background .15s"}}
                      onMouseEnter={e=>e.currentTarget.style.background="#1d4ed822"}
                      onMouseLeave={e=>e.currentTarget.style.background="#0d2d6e44"}>
                      <span style={{fontWeight:800,color:"#fff",fontSize:13}}>{t.id}</span>
                      <QRCanvas value={`BKMV|${t.id}|${t.tabSerial}`} size={44}/>
                      <span style={{fontFamily:"monospace",color:"#cbd5e1",fontSize:10}}>{t.tabSerial}</span>
                      <span className="issue-col-hide" style={{fontFamily:"monospace",color:"#94a3b8",fontSize:9}}>{t.kbSerial}</span>
                      <Badge condition={t.condition} issue={t.issue} small/>
                      <span className="issue-col-hide" style={{color:"#93c5fd",fontSize:10}}>{tIssues.length>0?`${tIssues.length} rec`:"—"}</span>
                      {active?<IssueStatusBadge status="ISSUED"/>:<span style={{color:"#475569",fontSize:10}}>—</span>}
                    </div>
                  );
                })}
              </div>
            )}

            {filtered.length===0&&(
              <div style={{textAlign:"center",padding:"60px 20px",color:"#64748b"}}>
                <div style={{fontSize:36,marginBottom:10}}>📱</div>
                <div style={{fontSize:15,fontWeight:600}}>No tabs found</div>
                <div style={{fontSize:12,marginTop:5}}>Try adjusting your search or filters</div>
              </div>
            )}
          </div>
        )}

        {page==="records"&&(
          <IssueRecordsPage
            issues={issues}
            tabs={tabs}
            onEdit={(rec)=>{
              const tab=tabs.find(t=>t.id===rec.tabId);
              if(tab) setIssueFormFor({tab,existingIssue:rec});
            }}
            onDelete={handleDeleteIssue}
            onAdd={(tabId)=>{
              const tab=tabs.find(t=>t.id===tabId);
              if(tab) setIssueFormFor({tab,existingIssue:null});
            }}
          />
        )}
      </div>

      <div className="no-print" style={{borderTop:"1px solid #1d4ed820",padding:"12px 20px",textAlign:"center",
        color:"#334155",fontSize:9,letterSpacing:1,marginTop:30}}>
        BIDENZIL KOBBEKADUWA MAHA VIDYALAYA · HALIELA · TAB MANAGEMENT SYSTEM · {new Date().getFullYear()} · Synced with Firebase
      </div>

      {/* Tab detail modal */}
      {selectedTab&&(
        <TabModal
          tab={selectedTab}
          issues={issues}
          onClose={()=>setSelectedTab(null)}
          onAddIssue={()=>setIssueFormFor({tab:selectedTab,existingIssue:null})}
          onEditIssue={(rec)=>setIssueFormFor({tab:selectedTab,existingIssue:rec})}
          onDeleteIssue={handleDeleteIssue}
        />
      )}

      {/* Issue form modal */}
      {issueFormFor&&(
        <IssueFormModal
          tab={issueFormFor.tab}
          existingIssue={issueFormFor.existingIssue}
          onSave={handleSaveIssue}
          onClose={()=>setIssueFormFor(null)}
        />
      )}

      {/* Toast */}
      {toast&&<Toast msg={toast} onClose={()=>setToast(null)}/>}

      <style>{`
        @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
      `}</style>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script>
</body>
